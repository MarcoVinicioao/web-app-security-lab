<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">

```
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Task Manager</title>
```

</head>

<body>

```
<header>
    <h1>Task Manager</h1>

    <p>
        Aplicación web educativa para gestionar tareas.
    </p>
</header>


<main>

    <section>
        <h2>Crear una tarea</h2>

        <form id="task-form">

            <label for="task">
                Nueva tarea:
            </label>

            <input
                type="text"
                id="task"
                name="task"
                placeholder="Escribe una tarea"
            >

            <button type="submit">
                Añadir tarea
            </button>

        </form>
    </section>


    <section>
        <h2>Mis tareas</h2>

        <ul id="task-list">

            <li>
                Aprender HTML
            </li>

            <li>
                Configurar el proyecto
            </li>

        </ul>
    </section>

</main>


<footer>

    <p>
        Web Application Security Lab
    </p>

</footer>
```

</body>

</html>
